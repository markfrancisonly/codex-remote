name: Build

# Docker image build:
# - pushes to `main` publish `latest` and an immutable `sha-*` tag
# - stable tags publish semver tags and update `latest`
#   (v1.2.3 -> latest, 1.2.3, 1.2, 1, sha-*); prereleases do not update latest
# - a weekly run rebuilds `latest` against the newest Codex release
# - pull requests run the checks and BUILD the image (nothing is pushed)
# Images go to GitHub's own registry (GHCR) with the built-in GITHUB_TOKEN.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - "*.sh"
      - codex-rc-status.py
      - compose.yaml
      - .github/workflows/build.yml
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  quality:
    name: Check scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check scripts
        run: |
          for f in *.sh; do bash -n "$f"; done
          python3 -m py_compile codex-rc-status.py

  docker:
    name: Build and push image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same resolution as build.sh: with CODEX_VERSION=latest the install
      # layer's cache key never moves, so pass the real release.
      - name: Resolve the Codex release
        id: codex
        run: |
          version="$(curl -fsSL https://releases.openai.com/codex/channels/latest \
                     | jq -r '.tag_name // empty' \
                     | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?' | head -1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Codex $version"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: codex-remote:smoke
          build-args: CODEX_VERSION=${{ steps.codex.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The entrypoint needs a signed-in ChatGPT account, so check the
      # toolbox the image promises instead of starting the supervisor.
      - name: Smoke-test image
        run: |
          docker run --rm --entrypoint bash codex-remote:smoke -ec '
            codex --version
            docker --version
            docker compose version
            for f in entrypoint.sh healthcheck.sh codex-login codex-pair codex-rc-status; do
              test -x "/usr/local/bin/$f"
            done
          '

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ github.event_name != 'schedule' }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CODEX_VERSION=${{ steps.codex.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
