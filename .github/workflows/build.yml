name: Build

# Docker image build:
# - pushes to `main` publish `latest` and an immutable `sha-*` tag
# - stable tags publish semver tags and update `latest`
#   (v1.2.3 -> latest, 1.2.3, 1.2, 1, sha-*); prereleases do not update latest
# - a weekly run rebuilds `latest` against the newest Codex release
# - pull requests run the checks and BUILD the image (nothing is pushed)
# Both architectures use the same resolved Codex release and are built and
# smoke-tested on native runners before publishing multi-platform tags.
# Images go to GitHub's own registry (GHCR) with the built-in GITHUB_TOKEN.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - "*.sh"
      - codex-rc-status.py
      - compose.yaml
      - .github/workflows/build.yml
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  quality:
    name: Check scripts and resolve release
    runs-on: ubuntu-latest
    outputs:
      codex-version: ${{ steps.codex.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check scripts
        run: |
          for f in *.sh; do bash -n "$f"; done
          python3 -m py_compile codex-rc-status.py

      # Same resolution as build.sh: with CODEX_VERSION=latest the install
      # layer's cache key never moves, so pass the real release. Resolve once
      # so both architectures contain the same version even during a release.
      - name: Resolve the Codex release
        id: codex
        run: |
          version="$(curl -fsSL https://releases.openai.com/codex/channels/latest \
                     | jq -r '.tag_name // empty' \
                     | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?' | head -1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Codex $version"

  docker:
    name: Build and test (${{ matrix.arch }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ github.event_name != 'schedule' }}

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: codex-remote:smoke
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CODEX_VERSION=${{ needs.quality.outputs.codex-version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      # The entrypoint needs a signed-in ChatGPT account, so check the
      # toolbox the image promises instead of starting the supervisor.
      - name: Smoke-test image
        env:
          EXPECTED_CODEX_VERSION: ${{ needs.quality.outputs.codex-version }}
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            --env EXPECTED_ARCH=${{ matrix.arch }} \
            --env EXPECTED_CODEX_VERSION \
            --entrypoint bash codex-remote:smoke -ec '
            test "$(dpkg --print-architecture)" = "$EXPECTED_ARCH"
            version=$(codex --version)
            printf "%s\n" "$version"
            test "$version" = "codex-cli $EXPECTED_CODEX_VERSION"
            docker --version
            docker compose version
            docker buildx version
            git --version
            node --version
            npm --version
            python3 --version
            sqlite3 --version
            for f in entrypoint.sh healthcheck.sh codex-login codex-pair codex-rc-status; do
              test -x "/usr/local/bin/$f"
            done
          '

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuse the tested build's release, cached layers and labels. Push by
      # digest so a single architecture cannot replace a shared image tag.
      - name: Push tested image by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CODEX_VERSION=${{ needs.quality.outputs.codex-version }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ github.event_name != 'schedule' }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "$arch")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" --raw | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | sort == ["amd64", "arm64"]
          '

      - name: Verify public image access
        env:
          IMAGE_PATH: ${{ github.repository }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          # Request an anonymous pull token without Docker credentials or GITHUB_TOKEN.
          if ! token=$(curl --disable --fail --silent --show-error --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:$IMAGE_PATH:pull" \
            https://ghcr.io/token | jq -er '.token // .access_token'); then
            echo "::error::Cannot pull ghcr.io/$IMAGE_PATH anonymously. Set the package visibility to Public in GitHub Package settings."
            exit 1
          fi
          curl --disable --fail --silent --show-error \
            --header "Authorization: Bearer $token" \
            --header 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/$IMAGE_PATH/manifests/$IMAGE_TAG" | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture]
              | sort == ["amd64", "arm64"]
            '
